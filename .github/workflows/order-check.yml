name: Order Check

on:
  schedule:
    - cron: '5 * * * *'
  workflow_dispatch:

jobs:
  order-check:
    runs-on: ubuntu-latest
    steps:
      - name: Render aufwecken
        run: |
          for i in {1..10}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://stele-e-transfer.onrender.com/api/health)
            echo "Versuch $i: HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then break; fi
            sleep 15
          done

      - name: Neue Bestellungen prüfen
        run: |
          curl -fsS --max-time 30 -H "X-Backup-Key: ${{ secrets.BACKUP_API_KEY }}" \
            https://stele-e-transfer.onrender.com/api/orders/check
