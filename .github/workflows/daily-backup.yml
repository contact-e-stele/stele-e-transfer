name: Daily Backup

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Render aufwecken
        run: |
          for i in {1..10}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://stele-e-transfer.onrender.com/api/health)
            echo "Versuch $i: HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then break; fi
            sleep 15
          done

      - name: Backup auslösen
        run: |
          curl -fsS --max-time 30 https://stele-e-transfer.onrender.com/api/backup/run
